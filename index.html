    document.addEventListener("pointerdown", () => app.sound.unlock(), {passive: true});
    document.addEventListener("keydown", () => app.sound.unlock());
    document.querySelectorAll("[data-mode]").forEach((element) => element.addEventListener("click", () => app.selectMode(element.dataset.mode)));
    const actions = {
      soundButton: () => { app.sound.toggle(); this.renderSound(); },
      newGame: () => app.newGame(),
      undo: () => app.undoClick(),
      flip: () => { app.flipped = !app.flipped; this.render(); },
      hint: () => app.hintClick(),
      adminBot: () => app.hintClick(true),
      copyFen: () => this.copy(app.match.engine.fen(), "Đã copy FEN."),
      loadFen: () => this.showFEN(),
      offerDraw: () => app.offerDrawClick(),
      claimDraw: () => this.showClaims(),
      resign: () => app.resignClick(),
      createRoom: () => app.openRoom("host"),
      joinRoom: () => app.openRoom("guest"),
      leaveRoom: () => app.leaveRoom(),
      copyCode: () => this.copy(app.net.code, "Đã copy mã phòng."),
      copyInvite: () => this.copyInvite(),
      movesTab: () => this.setTab("moves"),
      chatTab: () => this.setTab("chat")
    };
    for (const [id, action] of Object.entries(actions)) $(id).addEventListener("click", action);
    $("difficulty").addEventListener("change", () => app.updateLevel(Number($("difficulty").value)));
    $("offlineTime").addEventListener("change", () => app.updateTime(Number($("offlineTime").value)));
    $("roomInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") app.openRoom("guest");
    });
    $("chatForm").addEventListener("submit", (event) => {
      event.preventDefault();
      if (app.sendChat($("chatInput").value)) $("chatInput").value = "";
    });
    $("reactions").addEventListener("click", (event) => {
      if (event.target.tagName === "BUTTON") app.sendChat(event.target.textContent);
    });
  }

  setupBoard() {
    this.squares = Array.from({length: 64}, (_, position) => {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "square";
      tile.dataset.position = position;
      tile.tabIndex = position === this.focusIndex ? 0 : -1;
      this.board.append(tile);
      return tile;
    });
    const tileFor = (target) => target?.closest(".square");
    this.board.addEventListener("focusin", (event) => {
      const tile = tileFor(event.target);
      if (!tile) return;
      this.squares[this.focusIndex].tabIndex = -1;
      this.focusIndex = Number(tile.dataset.position);
      tile.tabIndex = 0;
    });
    this.board.addEventListener("keydown", (event) => {
      const offsets = {ArrowLeft: -1, ArrowRight: 1, ArrowUp: -8, ArrowDown: 8};
      if (!(event.key in offsets)) return;
      event.preventDefault();
      const to = this.focusIndex + offsets[event.key];
      if (to < 0 || to >= 64 || (Math.abs(offsets[event.key]) === 1 && (to >> 3) !== (this.focusIndex >> 3))) return;
      this.squares[to].focus();
    });
    this.board.addEventListener("click", (event) => {
      if (this.blockClick) { this.blockClick = false; return; }
      const tile = tileFor(event.target);
      if (tile) this.selectSquare(Number(tile.dataset.square));
    });
    this.board.addEventListener("pointerdown", (event) => {
      if (!event.isPrimary || event.button !== 0 || !this.app.canPlay()) return;
      const tile = tileFor(event.target);
      if (!tile) return;
      const from = Number(tile.dataset.square), engine = this.app.match.engine;
      if (engine.board[from] * engine.turn <= 0) return;
      this.pointer = {id: event.pointerId, from, tile, x: event.clientX, y: event.clientY, dragging: false};
    });
    window.addEventListener("pointermove", (event) => {
      const pointer = this.pointer;
      if (!pointer || pointer.id !== event.pointerId) return;
      if (!pointer.dragging) {
        if (Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y) < 7) return;
        if (!this.app.canPlay()) { this.cancelDrag(); return; }
        pointer.dragging = true;
        this.board.setPointerCapture(event.pointerId);
        this.selection = pointer.from;
        const ghost = $("ghost"), size = pointer.tile.clientWidth;
        ghost.style.width = ghost.style.height = size + "px";
        ghost.innerHTML = pieceSVG(this.app.match.engine.board[pointer.from]);
        ghost.hidden = false;
        this.renderBoard();
      }
      $("ghost").style.left = event.clientX + "px";
      $("ghost").style.top = event.clientY + "px";
    });
    window.addEventListener("pointerup", (event) => {
      const pointer = this.pointer;
      if (!pointer || pointer.id !== event.pointerId) return;
      this.cancelDrag();
      if (!pointer.dragging) return;
      this.blockClick = true;
      setTimeout(() => { this.blockClick = false; }, 0);
      const target = tileFor(document.elementFromPoint(event.clientX, event.clientY));
      if (target && this.board.contains(target)) this.tryMove(Number(target.dataset.square));
      else this.renderBoard();
    });
    window.addEventListener("pointercancel", (event) => {
      if (this.pointer?.id === event.pointerId) { this.cancelDrag(); this.renderBoard(); }
    });
    window.addEventListener("blur", () => { if (this.pointer) { this.cancelDrag(); this.renderBoard(); } });
    this.board.addEventListener("contextmenu", (event) => event.preventDefault());
  }

  cancelDrag() {
    this.pointer = null;
    $("ghost").hidden = true;
  }

  clearSelection() {
    this.selection = null;
    this.cancelDrag();
    this.dismiss("promotion");
    this.dismiss("claim");
  }

  selectSquare(square) {
    if (!this.app.canPlay()) return;
    if (this.selection === square) { this.selection = null; this.renderBoard(); return; }
    if (this.tryMove(square)) return;
    const engine = this.app.match.engine;
    this.selection = engine.board[square] * engine.turn > 0 ? square : null;
    this.renderBoard();
  }

  tryMove(to) {
    if (!this.app.canPlay() || this.selection === null) { this.renderBoard(); return false; }
    const candidates = this.app.match.legal.filter((move) => move.from === this.selection && move.to === to);
    if (!candidates.length) { this.renderBoard(); return false; }
    if (candidates[0].promotion) this.showPromotion(candidates);
    else this.app.submitMove(candidates[0]);
    return true;
  }

  renderBoard() {
    const {match, flipped, suggested} = this.app, {engine} = match;
    const last = engine.history.at(-1)?.move;
    const king = engine.inCheck() ? engine.kings[engine.turn] : -1;
    const canPlay = this.app.canPlay();
    const targets = new Map();
    if (canPlay && this.selection !== null) {
      for (const move of match.legal) if (move.from === this.selection) targets.set(move.to, move.captured);
    }
    this.squares.forEach((tile, i) => {
      const sq = core.SQUARES[flipped ? 63 - i : i], piece = engine.board[sq], name = core.squareName(sq);
      const visualRow = i >> 3, visualFile = i & 7;
      tile.dataset.square = sq;
      tile.classList.toggle("dark", !!((visualRow + visualFile) & 1));
      tile.classList.toggle("last", last?.from === sq || last?.to === sq);
      tile.classList.toggle("hint", suggested?.from === sq || suggested?.to === sq);
      tile.classList.toggle("check", king === sq);
      tile.classList.toggle("selected", canPlay && this.selection === sq);
      tile.classList.toggle("playable", canPlay && engine.turn * piece > 0);
      tile.classList.toggle("target", targets.has(sq) && !targets.get(sq));
      tile.classList.toggle("capture", targets.has(sq) && !!targets.get(sq));
      tile.classList.toggle("dragging", !!this.pointer?.dragging && this.pointer.from === sq);
      const label = name + (piece ? ", " + PIECE_NAMES[Math.abs(piece)] + " " + sideText(Math.sign(piece)) : ", ô trống");
      if (tile.getAttribute("aria-label") !== label || this.flipState !== flipped) {
        tile.setAttribute("aria-label", label);
        tile.innerHTML = pieceSVG(piece) + (visualFile === 0 ? '<span aria-hidden="true" class="coord rank">' + name[1] + '</span>' : "") +
          (visualRow === 7 ? '<span aria-hidden="true" class="coord file">' + name[0] + "</span>" : "");
      }
    });
    this.flipState = flipped;
  }

  render() {
    const {app} = this, {match, mode, offer, net} = app;
    const online = mode === "online", bot = mode === "bot", engine = match.engine;
    $("modeTitle").textContent = MODE[mode][0];
    $("modeSubtitle").textContent = MODE[mode][1];
    document.querySelectorAll("[data-mode]").forEach((element) => element.setAttribute("aria-pressed", String(element.dataset.mode === mode)));
    const badge = $("connectionBadge");
    const phase = net.phase;
    const connectionLabels = {
      idle: "Chưa vào phòng", waiting: "Đang chờ bạn bè", connecting: "Đang kết nối", handshake: "Đang kết nối",
      connected: "Đã kết nối", left: "Đối thủ đã thoát phòng", error: "Lỗi kết nối"
    };
    badge.classList.toggle("wait", online && ["connecting", "handshake", "waiting"].includes(phase));
    badge.classList.toggle("off", online && ["idle", "left", "error"].includes(phase));
    $("connectionText").textContent = online ? connectionLabels[phase] : "Chơi ngoại tuyến";
    $("roomCard").hidden = !online;
    app.ranking?.render();
    $("roomSetup").hidden = !!net.role;
    $("leaveRoom").hidden = !net.role;
    $("roomInfo").hidden = !net.code || !["waiting", "handshake", "connected"].includes(phase);
    $("roomCode").textContent = net.code;
    const authRoom = net.server && (net.kind || app.serverContext?.kind);
    $("serverNotice").hidden = !authRoom || (!net.role && !app.onlineStarted);
    $("roomNoticeText").textContent = authRoom === "rated" ? "Ván tính Elo" : "Ván giao hữu";
    const myAwards = app.serverContext?.awards;
    const myDelta = myAwards && (app.myColor === core.WHITE ? myAwards.white : myAwards.black);
    $("ratingChange").hidden = myDelta == null || !match.result;
    $("ratingChange").textContent = myDelta == null ? "" : "Elo " + (myDelta >= 0 ? "+" : "") + myDelta;
    $("offlineSetup").hidden = online;
    $("difficultyField").hidden = !bot;
    $("newGame").hidden = online && !net.connected;
    $("newGame").disabled = online && (!match.result || !!offer || app.serverContext?.canRematch === false);
    $("newGame").lastChild.textContent = online ? "Tái đấu" : "Ván mới";
    $("undo").disabled = !engine.history.length || (online && (!net.connected || !!offer || authRoom === "rated"));
    $("undo").lastChild.textContent = online ? "Xin đi lại" : "Đi lại";
    $("evalBar").hidden = online;
    $("hint").hidden = !app.hintsAvailable();
    $("hint").disabled = !app.canPlay() || app.hinting;
    $("hint").lastChild.textContent = online ? "Gợi ý AI" : "Gợi ý";
    $("adminBot").hidden = !online || !app.hintsAvailable();
    $("adminBot").disabled = $("hint").disabled;
    $("loadFen").hidden = online;
    $("flip").hidden = online;
    $("copyFen").disabled = online && !app.onlineStarted;
    $("offerDraw").hidden = bot;
    $("offerDraw").disabled = !!match.result || (online && (!net.connected || !!offer));
    $("resign").disabled = !!match.result || (online && (!net.connected || app.syncing));
    $("claimDraw").hidden = !app.canPlay() || (!match.claims.now && !match.claims.moves.length);
    $("chatTab").hidden = !online || !app.onlineStarted;
    $("chatInput").disabled = !net.connected;
    $("chatForm").querySelector("button").disabled = !net.connected;
    for (const item of $("reactions").children) item.disabled = !net.connected;
    if ($("chatTab").hidden && this.currentTab === "chat") this.setTab("moves");
    $("statusText").textContent = app.status();
    this.renderBoard();
    this.renderPlayers();
    this.renderMoves();
    if (!online) this.renderEvaluation();
    this.maybeShowOffer();
  }

  renderPlayers() {
    const {app} = this, {match} = app, {engine} = match;
    const captures = {1: [], "-1": []};
    const totals = {1: 0, "-1": 0}, points = [0, 1, 3, 3, 5, 9, 0];
    for (const square of core.SQUARES) {
      const piece = engine.board[square];
      if (piece) totals[Math.sign(piece)] += points[Math.abs(piece)];
    }
    for (const {side, move} of engine.history) if (move.captured) captures[side].push(move.captured);
    this.players.forEach((player, i) => {
      const side = (i === 0) === app.flipped ? core.WHITE : core.BLACK;
      player.side = side;
      const {parts} = player, profile = app.profile(side), taken = captures[side];
      parts.avatar.innerHTML = icon(profile.icon);
      parts["player-name"].textContent = profile.name;
      parts["player-color"].textContent = sideText(side) + (profile.elo == null ? "" : " · Elo " + profile.elo);
      parts.takes.innerHTML = taken.sort((a, b) => Math.abs(a) - Math.abs(b)).map(pieceSVG).join("");
      parts.takes.setAttribute("aria-label", taken.length ? "Đã ăn " + taken.map((piece) => PIECE_NAMES[Math.abs(piece)]).join(", ") : "");
      const advantage = totals[side] - totals[-side];
      parts.edge.textContent = advantage > 0 ? "+" + advantage : "";
      parts.clock.setAttribute("aria-label", "Đồng hồ " + sideText(side));
    });
    this.renderClocks();
  }

  renderClocks() {
    const {match} = this.app, times = match.times();
    for (const {element, parts, side} of this.players) {
      const active = match.running && !match.result && side === match.engine.turn;
      const total = Math.ceil(times[match.index(side)] / 1000);
      const display = match.minutes ? String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0") : "∞";
      if (parts.clock.textContent !== display) parts.clock.textContent = display;
      element.classList.toggle("active", active);
      parts.clock.classList.toggle("low", !!match.minutes && total <= 20);
    }
  }

  renderMoves() {
    const engine = this.app.match.engine, history = engine.history;
    const last = history.at(-1);
    if (this.lastHistory === engine && this.lastRecord === last) return;
    this.lastHistory = engine;
    this.lastRecord = last;
    const list = $("moveList");
    $("plyCount").textContent = history.length + " nước";
    list.replaceChildren();
    if (!history.length) {
      list.innerHTML = '<div class="empty">' + icon("list") + "<span>Chưa có nước đi</span></div>";
      return;
    }
    let row, number;
    for (const record of history) {
      if (record.number !== number) {
        number = record.number;
        row = document.createElement("div");
        row.className = "move-row";
        row.innerHTML = '<span class="move-no"></span><span></span><span></span>';
        row.children[0].textContent = number + ".";
        if (record.side === core.BLACK) row.children[1].textContent = "…";
        list.append(row);
      }
      const cell = row.children[record.side === core.WHITE ? 1 : 2];
      cell.textContent = record.san;
      cell.classList.toggle("last-san", record === last);
    }
    list.scrollTop = list.scrollHeight;
  }

  renderEvaluation() {
    const {match, flipped} = this.app;
    const score = core.evaluate(match.engine) / 100;
    const white = match.result ? (match.result.winner ? (match.result.winner > 0 ? 100 : 0) : 50) : 50 + 48 * Math.tanh(score / 6);
    const fill = $("evalFill");
    fill.style.height = white + "%";
    fill.style.top = flipped ? "0" : "auto";
    fill.style.bottom = flipped ? "auto" : "0";
    $("evalLabel").textContent = match.result ? (match.result.winner ? sideText(match.result.winner) : "½–½")
      : (score > .04 ? "+" : "") + (Math.abs(score) < .05 ? "0.0" : score.toFixed(1));
    $("evalBar").setAttribute("aria-label", "Đánh giá thế cờ " + $("evalLabel").textContent);
  }

  renderSound() {
    const enabled = this.app.sound.enabled, label = enabled ? "Tắt âm thanh" : "Bật âm thanh";
    const control = $("soundButton");
    control.innerHTML = icon(enabled ? "sound" : "mute");
    control.setAttribute("aria-pressed", String(enabled));
    control.setAttribute("aria-label", label);
    control.title = label;
  }

  setTab(tab) {
    this.currentTab = tab;
    for (const key of ["moves", "chat"]) {
      $(key + "Panel").hidden = key !== tab;
      $(key + "Tab").classList.toggle("active", key === tab);
      $(key + "Tab").setAttribute("aria-pressed", String(key === tab));
    }
    $("plyCount").hidden = tab !== "moves";
    if (tab === "chat") $("chatLog").scrollTop = $("chatLog").scrollHeight;
  }

  chat(name, text) {
    const line = document.createElement("p"), author = document.createElement("strong"), log = $("chatLog");
    author.textContent = name + " · ";
    line.append(author, text);
    log.append(line);
    if (log.children.length > 200) log.firstElementChild.remove();
    log.scrollTop = log.scrollHeight;
  }

  toast(message) {
    const toast = $("toast");
    clearTimeout(this.hideToast);
    toast.textContent = message;
    toast.hidden = false;
    this.hideToast = setTimeout(() => { toast.hidden = true; }, 3600);
  }

  async copy(value, success) {
    try {
      await navigator.clipboard.writeText(value);
      this.toast(success);
    } catch {
      const field = document.createElement("textarea");
      field.value = value;
      field.readOnly = true;
      field.rows = 3;
      field.className = "fen-input";
      field.setAttribute("aria-label", "Nội dung để sao chép");
      if (this.show("copy", "Sao chép nội dung", [field], [button("Đóng", () => this.dismiss("copy"), true)])) field.select();
    }
  }

  copyInvite() {
    const url = new URL(location.href);
    url.searchParams.set("room", this.app.net.code);
    url.hash = "";
    this.copy(url.href, url.protocol === "file:" ? "Đã copy link tệp. Bạn bè có thể mở bản của họ và nhập mã phòng." : "Đã copy link mời.");
  }

  show(key, title, content, actions, cancel = null) {
    if (this.modal.open) return false;
    this.modalKey = key;
    this.cancelModal = cancel;
    $("dialogTitle").textContent = title;
    $("dialogBody").replaceChildren(...content.map((item) => {
      if (typeof item !== "string") return item;
      const paragraph = document.createElement("p");
      paragraph.textContent = item;
      return paragraph;
    }));
    $("dialogActions").replaceChildren(...actions);
    this.modal.showModal();
    return true;
  }

  dismiss(key, cancelled = false) {
    if (!this.modal.open || this.modalKey !== key) return;
    const handler = this.cancelModal;
    this.modalKey = this.cancelModal = null;
    this.modal.close();
    if (cancelled) handler?.();
    queueMicrotask(() => this.maybeShowOffer());
  }

  confirm(key, title, message, action, accept = "Xác nhận") {
    this.show(key, title, [message], [
      button("Hủy", () => this.dismiss(key)),
      button(accept, () => { this.dismiss(key); action(); }, true)
    ]);
  }

  showPromotion(candidates) {
    const options = document.createElement("div");
    options.className = "promotions";
    for (const move of candidates) {
      const choice = button(PIECE_NAMES[move.promotion], () => {
        this.dismiss("promotion");
        this.app.submitMove(move);
      });
      choice.setAttribute("aria-label", PIECE_NAMES[move.promotion]);
      choice.title = PIECE_NAMES[move.promotion];
      choice.innerHTML = pieceSVG(move.promotion * this.app.match.engine.turn);
      options.append(choice);
    }
    this.show("promotion", "Phong cấp tốt", [options], [button("Hủy", () => this.dismiss("promotion"))]);
  }

  showFEN() {
    const field = document.createElement("textarea"), error = document.createElement("div");
    field.className = "fen-input";
    field.setAttribute("aria-label", "Chuỗi FEN");
    field.placeholder = "Dán chuỗi FEN";
    field.rows = 3;
    error.className = "form-error";
    error.setAttribute("role", "alert");
    this.show("fen", "Nạp thế cờ từ FEN", [field, error], [
      button("Hủy", () => this.dismiss("fen")),
      button("Nạp thế cờ", () => {
        try { this.app.loadFEN(field.value); this.dismiss("fen"); }
        catch (failure) { error.textContent = failure.message; }
      }, true)
    ]);
  }

  showClaims() {
    const {match} = this.app, {now, moves} = match.claims;
    if (!this.app.canPlay()) return;
    if (now) {
      this.confirm("claim", "Yêu cầu hòa theo luật", RESULT_TEXT[now.reason], () => this.app.claimClick(null));
      return;
    }
    if (!moves.length) return;
    const field = document.createElement("select");
    field.setAttribute("aria-label", "Nước đi dự định");
    for (const [index, move] of moves.entries()) {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = match.engine.sanBase(move, match.legal);
      field.append(option);
    }
    this.show("claim", "Yêu cầu hòa theo luật", ["Chọn nước đi dự định để xác lập điều kiện hòa.", field], [
      button("Hủy", () => this.dismiss("claim")),
      button("Yêu cầu hòa", () => { this.dismiss("claim"); this.app.claimClick(moves[Number(field.value)]); }, true)
    ]);
  }

  maybeShowOffer() {
    const {app} = this, {offer} = app;
    if (!offer || offer.by === app.myColor || offer.id === app.respondedOffer || !app.net.connected) return;
    const actions = {draw: ["Xin hòa", "Đối thủ đề nghị hòa."], undo: ["Xin đi lại", "Đối thủ muốn quay lại một nước."],
      rematch: ["Mời tái đấu", "Đối thủ muốn bắt đầu ván mới và đổi màu quân."]};
    const [title, message] = actions[offer.kind];
    const key = "offer:" + offer.id;
    const respond = (yes) => { app.answerOffer(offer.id, yes); this.dismiss(key); };
    this.show(key, title, [message], [
      button("Từ chối", () => respond(false)),
      button("Đồng ý", () => respond(true), true)
    ], () => app.answerOffer(offer.id, false));
  }
}
</script>
<script>
"use strict";

const RANKED_CODE = /^ELO-[A-HJ-NP-Z2-9]{5}$/;

async function chessAPI(path, body) {
  const options = {cache: "no-store", credentials: "same-origin", signal: AbortSignal.timeout(12000)};
  if (body !== undefined) Object.assign(options, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
  });
  const response = await fetch("/api" + path, options);
  const json = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw Object.assign(new Error(json.message || "Không kết nối được máy chủ Thế Cờ."), {
      status: response.status, code: json.code, state: json.state
    });
  }
  return json;
}

class RankingUI {
  constructor(app) {
    this.app = app;
    this.available = false;
    this.user = null;
    $("loginButton").addEventListener("click", () => this.openAuth());
    $("registerButton").addEventListener("click", () => this.openAuth(true));
    $("logoutButton").addEventListener("click", () => this.logout());
    $("leaderboardButton").addEventListener("click", () => this.openList(false));
    $("adminButton").addEventListener("click", () => this.openList(true));
    $("onlineKind").addEventListener("change", () => this.app.ui.render());
  }

  async refresh() {
    if (!["http:", "https:"].includes(location.protocol)) return;
    try {
      const {available, user} = await chessAPI("/account");
      if (available) {
        this.available = true;
        this.setUser(user);
      }
    } catch {}
  }

  setUser(user) {
    this.user = user;
    this.app.ui.render();
  }

  sessionLost() {
    if (this.app.net.server) this.app.net.fail("Phiên đăng nhập đã kết thúc. Hãy đăng nhập lại.");
    this.setUser(null);
  }

  render() {
    const user = this.user;
    $("accountControls").hidden = !this.available;
    $("onlineKindField").hidden = !this.available;
    $("nicknameField").hidden = this.available && $("onlineKind").value !== "peer";
    $("accountSummary").textContent = user
      ? user.username + " · Elo " + user.elo + (user.role === "admin" ? " · Admin" : "")
      : "Đăng nhập để chơi tính Elo.";
    $("loginButton").hidden = $("registerButton").hidden = !!user;
    $("logoutButton").hidden = !user;
    $("adminButton").hidden = user?.role !== "admin";
    if (this.available && !$("roomInput").value) {
      $("roomInput").placeholder = $("onlineKind").value === "peer" ? "CHESS-4829" : "ELO-6WM6G";
    }
  }

  openAuth(register = false, after = null) {
    const form = document.createElement("form"), feedback = document.createElement("div");
    form.id = "accountForm";
    form.className = "credential-form";
    feedback.className = "form-error";
    feedback.setAttribute("role", "alert");
    const field = (title, type, autocomplete, max, min) => {
      const label = document.createElement("label"), input = document.createElement("input");
      input.type = type;
      input.autocomplete = autocomplete;
      input.maxLength = max;
      input.minLength = min;
      input.required = true;
      label.append(title, input);
      form.append(label);
      return input;
    };
    const name = field("Tên tài khoản", "text", "username", 24, 3);
    name.pattern = "[A-Za-z0-9_]{3,24}";
    name.autocapitalize = "none";
    const password = field("Mật khẩu", "password", register ? "new-password" : "current-password", 128, 10);
    form.append(feedback);
    const title = register ? "Đăng ký" : "Đăng nhập";
    const submit = button(title, () => {}, true);
    submit.type = "submit";
    submit.setAttribute("form", form.id);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (submit.disabled) return;
      submit.disabled = true;
      feedback.textContent = "";
      try {
        const {user} = await chessAPI(register ? "/register" : "/login", {username: name.value, password: password.value});
        this.setUser(user);
        this.app.ui.dismiss("account");
        this.app.ui.toast("Đã đăng nhập với tài khoản " + user.username + ".");
        after?.();
      } catch (error) {
        feedback.textContent = error.message;
      } finally { submit.disabled = false; }
    });
    this.app.ui.show("account", title, [form], [
      button(register ? "Đăng nhập" : "Tạo tài khoản", () => {
        this.app.ui.dismiss("account");
        this.openAuth(!register, after);
      }),
      button("Hủy", () => this.app.ui.dismiss("account")), submit
    ]);
  }

  async logout() {
    try {
      await chessAPI("/logout", {});
      if (this.app.net.server && this.app.net.role) this.app.net.close(false);
      this.setUser(null);
      if (this.app.net.server) this.app.connectionChanged("idle");
    } catch (error) {
      this.app.ui.toast(error.message);
    }
  }

  openList(admin) {
    const list = document.createElement("div"), search = document.createElement("input");
    list.className = "identity-list";
    search.type = "search";
    search.placeholder = "Tìm theo tên tài khoản";
    search.setAttribute("aria-label", search.placeholder);
    let request = 0;
    async function load() {
      const latest = ++request;
      try {
        const path = admin ? "/admin/users?q=" + encodeURIComponent(search.value) : "/leaderboard";
        const {players} = await chessAPI(path);
        if (latest !== request) return;
        list.replaceChildren();
        if (!players.length) list.textContent = admin ? "Không tìm thấy tài khoản." : "Chưa có ván tính Elo nào.";
        players.forEach((player, index) => {
          const row = document.createElement("div"), detail = document.createElement("div");
          row.className = "identity-row";
          const label = document.createElement("strong"), meta = document.createElement("p");
          label.textContent = (admin ? "" : (index + 1) + ". ") + player.username;
          meta.className = "identity-meta";
          meta.style.marginBottom = "0";
          meta.textContent = player.games + " ván · Elo " + player.elo
            + (admin && player.role === "admin" ? " · Admin" : "")
            + (admin && player.suspended ? " · Đã khóa" : "");
          detail.append(label, meta);
          row.append(detail);
          if (!admin) {
            const rating = document.createElement("strong");
            rating.textContent = player.elo;
            meta.textContent = player.games + " ván";
            row.append(rating);
          } else if (player.role !== "admin") {
            const action = button(player.suspended ? "Mở khóa" : "Khóa", async () => {
              action.disabled = true;
              try {
                await chessAPI("/admin/suspension", {id: player.id, suspended: !player.suspended});
                load();
              } catch (error) {
                action.disabled = false;
                meta.textContent = error.message;
              }
            });
            action.className = "surface";
            row.append(action);
          }
          list.append(row);
        });
      } catch (error) {
        if (latest === request) list.textContent = error.message;
      }
    }
    search.addEventListener("input", load);
    list.textContent = "Đang tải…";
    if (this.app.ui.show("ranking", admin ? "Quản trị tài khoản" : "Bảng Elo", admin ? [search, list] : [list],
      [button("Đóng", () => this.app.ui.dismiss("ranking"), true)])) load();
  }
}

class ServerOnlineManager {
  constructor(handlers) {
    this.server = true;
    this.handlers = handlers;
    this.token = 0;
    this.close(false);
  }

  get connected() { return this.phase === "connected"; }

  change(phase, detail) {
    this.phase = phase;
    this.handlers.status(phase, detail);
  }

  ready() { if (!this.connected) this.change("connected"); }

  async open(code, data) {
    this.close(false);
    this.role = "guest";
    this.code = code;
    const token = this.token;
    this.change("connecting");
    try {
      const room = await chessAPI(code ? "/rooms/" + code + "/join" : "/rooms", data);
      if (token !== this.token) return;
      this.code = room.code;
      this.apply(room.state);
      if (token !== this.token) return;
      const stream = this.stream = new EventSource("/api/rooms/" + this.code + "/events");
      stream.onmessage = (event) => {
        if (token !== this.token) return;
        try { this.apply(JSON.parse(event.data)); } catch {}
      };
      stream.onerror = () => {
        if (token !== this.token) return;
        if (stream.readyState === EventSource.CLOSED) this.fail("Không mở được kết nối tới phòng.");
        else if (this.phase !== "connecting") this.change("connecting");
      };
    } catch (error) {
      if (this.token !== token) return;
      this.close(false);
      if (error.status === 401) this.handlers.sessionLost();
      else this.change("error", error.message);
    }
  }

  apply(packet, force = false) {
    if (packet.type === "SESSION_END") { this.handlers.sessionLost(); return; }
    if (packet.type === "ROOM_CLOSED") { this.fail("Phòng đã đóng."); return; }
    if (packet.type === "CHAT") { this.handlers.data(packet); return; }
    if (!["STATE", "ROOM_WAITING"].includes(packet.type) || packet.revision < this.lastRevision) return;
    const recovering = this.phase === "connecting";
    if (packet.revision === this.lastRevision && !force && !recovering) return;
    this.lastRevision = packet.revision;
    if (packet.type === "ROOM_WAITING") {
      this.kind = packet.kind;
      if (this.phase !== "waiting") this.change("waiting");
    } else {
      if (!this.connected) this.change("handshake");
      this.handlers.data(packet);
    }
  }

  send(packet) {
    if (!this.role || !this.code) return false;
    const token = this.token, code = this.code;
    chessAPI("/rooms/" + code + "/action", packet).then(({state}) => {
      if (token === this.token) this.apply(state, packet.type === "SYNC_REQUEST");
    }).catch((error) => {
      if (token !== this.token) return;
      if (error.status === 401) { this.handlers.sessionLost(); return; }
      if (error.state) this.apply(error.state, true);
      this.handlers.failedAction(packet, error.message);
    });
    return true;
  }

  async leave() {
    if (!this.role || !this.code) { this.close(); return; }
    const token = this.token;
    try {
      await chessAPI("/rooms/" + this.code + "/action", {type: "LEAVE"});
      if (token === this.token) this.close();
    } catch (error) {
      if (token !== this.token) return;
      if (error.status === 401) this.handlers.sessionLost();
      else if (error.status === 404) this.close();
      else this.handlers.failedAction({type: "LEAVE"}, error.message);
    }
  }

  fail(message, phase = "error") {
    this.close(false);
    this.change(phase, message);
  }

  close(notify = true) {
    this.stream?.close();
    this.stream = null;
    this.token++;
    this.phase = "idle";
    this.code = "";
    this.kind = null;
    this.role = null;
    this.lastRevision = -1;
    if (notify) this.change("idle");
  }
}
</script>
<script>
"use strict";

const OFFER_KINDS = new Set(["draw", "undo", "rematch"]);
const safeMove = (packet) => packet && typeof packet === "object" &&
  core.squareIndex(packet.from) >= 0 && core.squareIndex(packet.to) >= 0 &&
  (packet.promotion == null || ["q", "r", "b", "n"].includes(packet.promotion));
const validClocks = (packet, minutes) => [packet.whiteTime, packet.blackTime]
  .every((time) => Number.isSafeInteger(time) && time >= 0 && time <= minutes * 60000);

class ChessApp {
  constructor() {
    this.mode = "bot";
    this.match = new ChessMatch();
    this.sound = new SoundManager();
    this.ai = new AIWorker();
    this.level = 2;
    this.offlineMinutes = 0;
    this.flipped = false;
    this.thinking = this.hinting = false;
    this.work = 0;
    this.suggested = null;
    this.resetRoom();
    this.peerNet = new MultiplayerManager({
      open: () => { if (this.net.role === "guest") this.net.send({type: "HELLO", version: 1, name: this.nickname}); },
      data: (packet) => this.receive(packet),
      status: (phase, detail) => this.connectionChanged(phase, detail)
    });
    this.serverNet = new ServerOnlineManager({
      data: (packet) => this.receive(packet),
      status: (phase, detail) => this.connectionChanged(phase, detail),
      sessionLost: () => this.ranking.sessionLost(),
      failedAction: (packet, message) => {
        if (packet.type === "MOVE") this.pendingMove = false;
        if (packet.type === "SYNC_REQUEST") this.syncing = false;
        if (packet.type === "REPLY") this.respondedOffer = null;
        this.ui.toast(message);
        this.ui.render();
      }
    });
    this.net = this.peerNet;
    this.ui = new UIRenderer(this);
    this.ranking = new RankingUI(this);
    const invite = new URL(location.href).searchParams.get("room")?.trim().toUpperCase();
    if (invite && (ROOM_CODE.test(invite) || RANKED_CODE.test(invite))) {
      $("roomInput").value = invite;
      if (RANKED_CODE.test(invite)) $("onlineKind").value = "rated";
      this.switchMode("online");
    }
    this.ui.render();
    this.ranking.refresh();
    setInterval(() => this.tick(), 100);
    window.addEventListener("pagehide", () => this.net.close(!this.net.server));
  }

  resetRoom() {
    this.serverContext = null;
    this.onlineStarted = false;
    this.myColor = core.WHITE;
    this.hostColor = core.WHITE;
    this.gameId = 0;
    this.revision = 0;
    this.nextOffer = 0;
    this.respondedOffer = null;
    this.offer = null;
    this.pendingMove = false;
    this.syncing = false;
    this.syncAt = 0;
    this.broadcastAt = 0;
    this.lastIncomingChat = -Infinity;
    this.lastSentChat = -Infinity;
    this.hostName = "Chủ phòng";
    this.guestName = "Khách";
  }

  profile(side) {
    if (this.mode === "bot") return side === core.WHITE ? {name: "Bạn", icon: "user"} : {name: "Bot AI", icon: "bot"};
    if (this.mode === "local") return {name: "Người chơi " + sideText(side), icon: "user"};
    if (!this.onlineStarted) return {name: "Quân " + sideText(side), icon: "user"};
    const isHost = side === this.hostColor;
    return {name: isHost ? this.hostName : this.guestName, icon: side === this.myColor ? "user" : "users",
      elo: isHost ? this.serverContext?.hostElo : this.serverContext?.guestElo};
  }

  canPlay() {
    if (this.match.result || !this.match.running) return false;
    const turn = this.match.engine.turn;
    if (this.mode === "bot") return turn === core.WHITE && !this.thinking;
    if (this.mode === "online") return this.net.connected && this.onlineStarted && this.myColor === turn && !this.pendingMove && !this.syncing;
    return true;
  }

  hintsAvailable() {
    return this.mode !== "online" ||
      (this.ranking?.user?.role === "admin" && this.onlineStarted && this.net.connected);
  }

  status() {
    const {match, net} = this;
    if (match.result) {
      const {reason, winner} = match.result;
      return RESULT_TEXT[reason] + (winner ? " · " + sideText(winner) + " thắng" : "");
    }
    if (this.mode === "online") {
      if (this.syncing) return "Đang đồng bộ bàn cờ…";
      if (!net.connected) {
        if (net.phase === "waiting") return "Đang chờ đối thủ vào phòng";
        if (net.phase === "connecting" || net.phase === "handshake") return "Đang thiết lập kết nối…";
        if (net.phase === "left") return "Ván đấu đã dừng";
        return "Tạo phòng hoặc nhập mã để bắt đầu";
      }
      if (this.pendingMove) return "Đang xác nhận nước đi…";
    }
    if (this.thinking) return "AI đang suy nghĩ…";
    if (this.hinting) return "Đang tìm nước gợi ý…";
    const turn = match.engine.turn;
    return "Lượt quân " + sideText(turn) + (match.engine.inCheck() ? " · Đang bị chiếu" : "");
  }

  selectMode(mode) {
    if (mode === this.mode || !Object.hasOwn(MODE, mode)) return;
    if (this.mode === "online" && this.net.connected && !this.net.server) {
      this.ui.confirm("leave", "Rời phòng chơi?", "Ván online sẽ dừng khi bạn rời phòng.", () => this.switchMode(mode), "Rời phòng");
    } else {
      this.switchMode(mode);
    }
  }

  switchMode(mode) {
    this.net.close(false);
    this.net = this.peerNet;
    this.resetRoom();
    this.mode = mode;
    this.flipped = false;
    this.ui.setTab("moves");
    $("chatLog").replaceChildren();
    this.replaceMatch(new ChessMatch(mode === "online" ? 0 : this.offlineMinutes, core.START, mode !== "online"));
  }

  cancelWork() {
    this.work++;
    this.ai.cancel();
    this.thinking = this.hinting = false;
    this.suggested = null;
  }

  replaceMatch(match) {
    this.cancelWork();
    this.match = match;
    this.ui.clearSelection();
    this.ui.render();
    this.scheduleBot();
  }

  newGame() {
    if (this.mode === "online") { this.requestOffer("rematch"); return; }
    this.replaceMatch(new ChessMatch(this.offlineMinutes));
  }

  updateLevel(level) {
    if (![1, 2, 3, 4].includes(level)) return;
    this.level = level;
    this.cancelWork();
    this.ui.render();
    this.scheduleBot();
  }

  updateTime(minutes) {
    if (!TIMER_OPTIONS.has(minutes)) return;
    this.offlineMinutes = minutes;
    if (!this.match.engine.history.length && !this.match.result) this.replaceMatch(new ChessMatch(minutes, this.match.engine.fen()));
    else this.ui.toast("Đồng hồ mới sẽ áp dụng từ ván tiếp theo.");
  }

  loadFEN(fen) {
    if (this.mode !== "online") this.replaceMatch(new ChessMatch(this.offlineMinutes, fen));
  }

  moveSound(record) {
    const move = record.move;
    const cue = this.match.result ? "end" : move.promotion ? "promote" : move.rook !== undefined ? "castle"
      : this.match.engine.inCheck() ? "check" : move.captured ? "capture" : "move";
    this.sound.play(cue);
  }

  submitMove(input) {
    if (!this.canPlay() || this.checkTimeout()) return;
    const move = this.match.engine.resolve(input, this.match.legal);
    if (!move) return;
    if (this.mode !== "online") { this.playOffline(move); return; }
    if (this.net.role === "host") { this.commitOnline(move); return; }
    this.cancelWork();
    this.pendingMove = true;
    this.pendingAt = performance.now();
    const sent = this.net.send({
      type: "MOVE", game: this.gameId, revision: this.revision, ...core.moveWire(move),
      fen: this.match.project(move), ...this.match.clockPacket()
    });
    if (!sent) this.pendingMove = false;
    this.ui.clearSelection();
    this.ui.render();
  }

  playOffline(move) {
    this.cancelWork();
    const record = this.match.play(move);
    if (record) this.moveSound(record);
    this.ui.clearSelection();
    this.ui.render();
    this.scheduleBot();
  }

  async scheduleBot() {
    if (this.mode !== "bot" || this.match.engine.turn !== core.BLACK || this.match.result || this.thinking) return;
    const job = ++this.work;
    this.thinking = true;
    this.ui.render();
    const time = this.match.times()[1];
    const budget = this.match.minutes ? Math.max(15, Math.min(2400, time - 75)) : 2400;
    let answer;
    try {
      answer = await this.ai.find(this.match.engine, this.level, {book: true, random: true, allowClaim: true, budget});
    } catch {
      if (job !== this.work) return;
      this.ui.toast("Bot không khởi động được Web Worker và sẽ đi một nước hợp lệ.");
      answer = {move: this.match.legal[0]};
    }
    if (job !== this.work) return;
    this.thinking = false;
    if (this.checkTimeout()) return;
    if (answer?.claim && this.match.claim(answer.move)) { this.afterFinish(); return; }
    if (answer?.move) this.playOffline(answer.move);
    else this.ui.render();
  }

  async hintClick(autoPlay = false) {
    if (!this.hintsAvailable() || !this.canPlay() || this.hinting) return;
    const online = this.mode === "online";
    if (autoPlay && !online) return;
    const {engine} = this.match;
    const fen = engine.fen();
    const request = this.net.server ? {room: this.net.code, game: this.gameId, revision: this.revision} : {fen};
    const job = ++this.work;
    this.hinting = true;
    this.ui.render();
    try {
      const answer = online ? await chessAPI("/admin/assist", request) : await this.ai.find(engine, 3, {budget: 1250});
      if (job !== this.work || engine !== this.match.engine || engine.fen() !== fen ||
          !this.canPlay() || !this.hintsAvailable() || !answer?.move) return;
      const move = this.match.engine.resolve(answer.move, this.match.legal);
      if (!move) return;
      if (autoPlay) this.submitMove(move);
      else {
        this.suggested = move;
        this.ui.toast("Gợi ý " + this.match.engine.sanBase(move, this.match.legal));
      }
    } catch (error) {
      if (job !== this.work) return;
      if (online && error.status === 401) this.ranking.sessionLost();
      else this.ui.toast(online ? error.message : "Không khởi động được công cụ gợi ý.");
    } finally {
      if (job === this.work) { this.hinting = false; this.ui.render(); }
    }
  }

  undoClick() {
    if (this.mode === "online") { this.requestOffer("undo"); return; }
    if (!this.match.engine.history.length) return;
    this.cancelWork();
    const count = this.mode === "bot" && this.match.engine.turn === core.WHITE ? 2 : 1;
    this.match.undo(count);
    this.ui.clearSelection();
    this.ui.render();
    this.scheduleBot();
  }

  offerDrawClick() {
    if (this.match.result) return;
    if (this.mode === "online") { this.requestOffer("draw"); return; }
    if (this.mode === "local") {
      this.ui.confirm("localDraw", "Hòa thỏa thuận?", "Người chơi còn lại có đồng ý hòa không?", () => {
        if (!this.checkTimeout() && this.match.finish(core.makeResult("agreement"))) this.afterFinish();
      }, "Đồng ý hòa");
    }
  }

  resignClick() {
    if (this.match.result || (this.mode === "online" && !this.net.connected)) return;
    const side = this.mode === "online" ? this.myColor : this.mode === "bot" ? core.WHITE : this.match.engine.turn;
    this.ui.confirm("resign", "Đầu hàng?", "Quân " + sideText(side) + " sẽ đầu hàng.", () => {
      if (this.mode === "online" && this.net.role === "guest") {
        this.net.send({type: "RESIGN", game: this.gameId});
      } else if (!this.checkTimeout() && this.match.resign(side)) {
        this.afterFinish();
      }
    }, "Đầu hàng");
  }

  claimClick(move) {
    if (!this.canPlay() || this.checkTimeout()) return;
    if (this.mode === "online" && this.net.role === "guest") {
      this.net.send({type: "CLAIM", game: this.gameId, revision: this.revision, move: move ? core.moveWire(move) : null});
    } else if (this.match.claim(move)) this.afterFinish();
  }

  checkTimeout() {
    if (this.mode === "online" && this.net.role !== "host") return false;
    if (!this.match.timeout()) return false;
    this.afterFinish();
    return true;
  }

  afterFinish() {
    this.cancelWork();
    this.setOffer(null);
    this.ui.clearSelection();
    this.ui.dismiss("resign");
    this.ui.dismiss("localDraw");
    if (this.mode === "online" && this.net.role === "host" && this.onlineStarted) {
      this.revision++;
      this.sendState();
    }
    this.sound.play("end");
    this.ui.render();
  }

  tick() {
    this.checkTimeout();
    this.ui.renderClocks();
    if (this.mode !== "online" || !this.net.connected || !this.onlineStarted) return;
    const now = performance.now();
    if (this.net.role === "host" && this.match.running && this.match.minutes && now - this.broadcastAt >= 2000) {
      this.broadcastAt = now;
      this.net.send({type: "CLOCK", game: this.gameId, revision: this.revision, ...this.match.clockPacket()});
    } else if (this.net.role === "guest" && this.pendingMove && now - this.pendingAt >= 4500) {
      this.requestSync();
    } else if (this.net.role === "guest" && this.syncing && now - this.syncAt >= 7500) {
      this.net.fail("Không nhận được bản đồng bộ từ chủ phòng.", "left");
    }
  }

  openRoom(role) {
    if (this.mode !== "online" || this.net.role) return;
    let code = $("roomInput").value.trim().toUpperCase();
    const kind = $("onlineKind").value;
    if (role === "host" ? kind !== "peer" : RANKED_CODE.test(code)) {
      this.openServerRoom(role === "guest" ? code : "");
      return;
    }
    if (/^\d{4}$/.test(code)) code = "CHESS-" + code;
    if (role === "guest" && !ROOM_CODE.test(code)) {
      this.ui.toast("Nhập mã phòng dạng CHESS-4829" + (this.ranking.available ? " hoặc ELO-6WM6G." : "."));
      $("roomInput").focus();
      return;
    }
    this.net = this.peerNet;
    this.resetRoom();
    this.nickname = cleanName($("nickname").value || (role === "host" ? "Chủ phòng" : "Khách"));
    const choice = $("hostColor").value;
    this.hostColor = choice === "b" || (choice === "random" && Math.random() < .5) ? core.BLACK : core.WHITE;
    this.onlineMinutes = Number($("onlineTime").value);
    this.flipped = false;
    $("chatLog").replaceChildren();
    this.replaceMatch(new ChessMatch(0, core.START, false));
    this.net.open(role, code);
  }

  openServerRoom(code) {
    if (this.mode !== "online" || this.net.role) return;
    if (!this.ranking.available) {
      this.ranking.refresh();
      this.ui.toast("Hãy mở ván Elo trên địa chỉ web có máy chủ Thế Cờ.");
      return;
    }
    if (!this.ranking.user) {
      this.ranking.openAuth(false, () => this.openServerRoom(code));
      return;
    }
    this.resetRoom();
    this.net = this.serverNet;
    this.flipped = false;
    $("chatLog").replaceChildren();
    this.replaceMatch(new ChessMatch(0, core.START, false));
    const choice = $("hostColor").value;
    const options = code ? {} : {
      kind: $("onlineKind").value, minutes: Number($("onlineTime").value),
      color: choice === "w" ? 1 : choice === "b" ? -1 : 0
    };
    this.net.open(code, options);
  }

  leaveRoom() {
    if (!this.net.server) { this.net.close(); return; }
    if (this.onlineStarted && this.match.running) {
      this.ui.confirm("room-leave", "Rời phòng đang chơi?", "Rời phòng bây giờ được tính là đầu hàng.",
        () => this.net.leave(), "Rời phòng");
    } else this.net.leave();
  }

  connectionChanged(phase, detail) {
    if (this.mode !== "online") return;
    if (phase === "idle") {
      this.setOffer(null);
      this.resetRoom();
      this.flipped = false;
      this.replaceMatch(new ChessMatch(0, core.START, false));
      $("chatLog").replaceChildren();
    } else if (phase === "left" || phase === "error") {
      this.cancelWork();
      this.match.readClocks(this.match.clockPacket(), false);
      this.pendingMove = this.syncing = false;
      this.setOffer(null);
      this.ui.clearSelection();
      if (detail) this.ui.toast(detail);
    }
    this.ui.render();
  }

  startOnline(guestName, rematch = false) {
    if (rematch) this.hostColor = -this.hostColor;
    else {
      this.hostName = this.nickname;
      this.guestName = cleanName(guestName);
    }
    this.setOffer(null);
    this.onlineStarted = true;
    this.gameId++;
    this.revision++;
    this.myColor = this.hostColor;
    this.flipped = this.myColor === core.BLACK;
    this.match = new ChessMatch(this.onlineMinutes);
    this.ui.clearSelection();
    if (!this.net.connected) this.net.ready();
    this.sendState();
    this.ui.render();
  }

  sendState() {
    const {match} = this;
    this.net.send({
      type: "STATE", version: 1, game: this.gameId, revision: this.revision,
      hostColor: this.hostColor, host: this.hostName, guest: this.guestName, minutes: match.minutes,
      initial: match.engine.initialFEN, moves: match.engine.history.map(({move}) => core.moveWire(move)),
      fen: match.engine.fen(), ...match.clockPacket(), running: match.running,
      result: match.result, offer: this.offer
    });
  }

  acceptState(packet) {
    if (packet.version !== 1 || !Number.isSafeInteger(packet.game) || packet.game < 1 || packet.game < this.gameId ||
        !Number.isSafeInteger(packet.revision) || packet.revision < 1 || packet.revision < this.revision ||
        !validColor(packet.hostColor) || !TIMER_OPTIONS.has(packet.minutes) || !validClocks(packet, packet.minutes) ||
        !Array.isArray(packet.moves) || packet.moves.length > 20000 || packet.initial !== core.START ||
        typeof packet.running !== "boolean" || (packet.result !== null &&
        (!packet.result || !Object.hasOwn(RESULT_TEXT, packet.result.reason) || ![0, 1, -1].includes(packet.result.winner)))) return;
    if (this.net.server && (!validColor(packet.myColor) || !["rated", "assisted"].includes(packet.kind))) return;
    const match = new ChessMatch(packet.minutes, packet.initial);
    for (const input of packet.moves) {
      if (!safeMove(input) || !match.play(input)) return;
    }
    if (match.engine.fen() !== packet.fen || packet.running === !!packet.result) return;
    if (match.result && (match.result.reason !== packet.result?.reason || match.result.winner !== packet.result?.winner)) return;
    const oldResult = this.match.result, previousGame = this.gameId, oldLength = this.match.engine.history.length;
    if (packet.result) match.result = core.makeResult(packet.result.reason, packet.result.winner);
    match.readClocks(packet, packet.running);
    this.onlineStarted = true;
    this.gameId = packet.game;
    this.revision = packet.revision;
    this.hostColor = packet.hostColor;
    this.hostName = cleanName(packet.host);
    this.guestName = cleanName(packet.guest);
    this.myColor = this.net.server ? packet.myColor : -packet.hostColor;
    this.flipped = this.myColor === core.BLACK;
    this.match = match;
    this.pendingMove = this.syncing = false;
    this.cancelWork();
    if (this.net.server) {
      this.serverContext = {
        kind: packet.kind, awards: packet.awards, hostElo: packet.hostElo, guestElo: packet.guestElo,
        canRematch: packet.canRematch
      };
      if (this.ranking.user) {
        this.ranking.user = {...this.ranking.user, elo: packet.elo, games: packet.games};
      }
    }
    this.setOffer(this.validateOffer(packet.offer));
    this.ui.clearSelection();
    if (match.result) this.ui.dismiss("resign");
    if (!this.net.connected) this.net.ready();
    const stepped = this.net.server && previousGame === this.gameId && oldLength + 1 === packet.moves.length;
    if (stepped) this.moveSound(match.engine.history.at(-1));
    else if (oldResult === null && match.result) this.sound.play("end");
    if (previousGame && previousGame !== this.gameId) this.ui.toast("Tái đấu · Hai người đã đổi màu quân.");
    else if (previousGame && oldLength > packet.moves.length) this.ui.toast("Đã lùi một nước.");
    this.ui.render();
  }

  requestSync() {
    if (this.syncing || !this.net.connected) return;
    this.syncing = true;
    this.pendingMove = false;
    this.syncAt = performance.now();
    this.net.send({type: "SYNC_REQUEST", game: this.gameId, revision: this.revision});
    this.ui.clearSelection();
    this.ui.render();
  }

  commitOnline(move) {
    const side = this.match.engine.turn;
    const record = this.match.play(move);
    if (!record) return;
    this.cancelWork();
    if (this.match.result || (this.offer && (this.offer.kind !== "draw" || this.offer.by !== side))) this.setOffer(null);
    this.revision++;
    this.broadcastAt = performance.now();
    this.net.send({
      type: "MOVE", game: this.gameId, revision: this.revision, ...core.moveWire(move),
      fen: this.match.engine.fen(), ...this.match.clockPacket(), offer: this.offer
    });
    this.moveSound(record);
    this.ui.clearSelection();
    this.ui.render();
  }

  acceptMove(packet) {
    if (packet.game === this.gameId && packet.revision <= this.revision) return;
    if (packet.game !== this.gameId || packet.revision !== this.revision + 1 ||
        !safeMove(packet) || !validClocks(packet, this.match.minutes)) { this.requestSync(); return; }
    const move = this.match.engine.resolve(packet, this.match.legal);
    if (!move || this.match.project(move) !== packet.fen) { this.requestSync(); return; }
    const record = this.match.play(move);
    if (!record) { this.requestSync(); return; }
    this.cancelWork();
    this.match.readClocks(packet, !this.match.result);
    this.revision = packet.revision;
    this.pendingMove = this.syncing = false;
    this.setOffer(this.validateOffer(packet.offer));
    this.moveSound(record);
    this.ui.clearSelection();
    this.ui.render();
  }

  offerAllowed(kind) {
    if (!this.net.connected || !this.onlineStarted || !OFFER_KINDS.has(kind) || this.syncing || this.offer) return false;
    if (kind === "rematch") return !!this.match.result && this.serverContext?.canRematch !== false;
    if (kind === "undo") return this.serverContext?.kind !== "rated" && this.match.engine.history.length > 0;
    return !this.match.result;
  }

  validateOffer(value) {
    if (!value || !Number.isSafeInteger(value.id) || value.id < 1 || value.game !== this.gameId ||
        !validColor(value.by) || !OFFER_KINDS.has(value.kind)) return null;
    return {id: value.id, game: value.game, by: value.by, kind: value.kind};
  }

  setOffer(offer) {
    const old = this.offer;
    this.offer = offer;
    if (old?.id !== offer?.id && old) this.ui.dismiss("offer:" + old.id);
  }

  requestOffer(kind) {
    if (!this.offerAllowed(kind) || this.checkTimeout()) return;
    if (this.net.role === "host") this.createOffer(kind, this.myColor);
    else this.net.send({type: "REQUEST", kind, game: this.gameId, revision: this.revision});
  }

  createOffer(kind, by) {
    if (!this.offerAllowed(kind)) return;
    this.setOffer({id: ++this.nextOffer, game: this.gameId, by, kind});
    this.net.send({type: "OFFER", game: this.gameId, revision: this.revision, offer: this.offer});
    if (by === this.myColor) this.ui.toast("Đã gửi lời đề nghị.");
    this.ui.render();
  }

  answerOffer(id, accepted) {
    if (!this.net.connected || this.offer?.id !== id || this.offer.by === this.myColor) return;
    this.respondedOffer = id;
    if (this.net.role === "host") this.resolveOffer(id, accepted, this.myColor);
    else this.net.send({type: "REPLY", game: this.gameId, id, accepted});
  }

  resolveOffer(id, accepted, by) {
    const offer = this.offer;
    if (!offer || offer.id !== id || offer.by === by || typeof accepted !== "boolean") return;
    if (this.checkTimeout()) return;
    this.setOffer(null);
    if (!accepted) {
      this.net.send({type: "OFFER_END", game: this.gameId, id, by});
      if (offer.by === this.myColor) this.ui.toast("Đối thủ đã từ chối.");
      this.ui.render();
      return;
    }
    if (offer.kind === "draw" && this.match.finish(core.makeResult("agreement"))) {
      this.afterFinish();
    } else if (offer.kind === "undo" && this.match.undo()) {
      this.revision++;
      this.ui.clearSelection();
      this.sendState();
      this.ui.toast("Đã lùi một nước.");
      this.ui.render();
    } else if (offer.kind === "rematch" && this.match.result) {
      this.startOnline(null, true);
      this.ui.toast("Tái đấu · Hai người đã đổi màu quân.");
    }
  }

  sendChat(text) {
    const now = performance.now(), message = text.trim().slice(0, 240);
    if (!message || !this.net.connected || now - this.lastSentChat < 230) return false;
    if (!this.net.send({type: "CHAT", text: message})) return false;
    this.lastSentChat = now;
    this.ui.chat(this.profile(this.myColor).name, message);
    return true;
  }

  receive(packet) {
    if (this.mode !== "online") return;
    const host = this.net.role === "host";
    if (!this.net.connected) {
      if (this.net.phase !== "handshake") return;
      if (host && packet.type === "HELLO" && packet.version === 1 && !this.onlineStarted) this.startOnline(packet.name);
      else if (!host && packet.type === "STATE") this.acceptState(packet);
      return;
    }
    if (packet.type === "LEAVE") { this.net.fail("Đối thủ đã thoát phòng.", "left"); return; }
    if (packet.type === "CHAT") {
      const now = performance.now();
      const message = typeof packet.text === "string" ? packet.text.slice(0, 240).trim() : "";
      if (message && now - this.lastIncomingChat >= 200) {
        this.lastIncomingChat = now;
        this.ui.chat(this.profile(-this.myColor).name, message);
        this.sound.play("message");
      }
      return;
    }
    if (host) this.receiveAsHost(packet);
    else this.receiveAsGuest(packet);
  }

  receiveAsHost(packet) {
    if (packet.type === "SYNC_REQUEST") { this.sendState(); return; }
    if (this.checkTimeout()) return;
    if (packet.game !== this.gameId) {
      if (packet.type === "MOVE") this.sendState();
      return;
    }
    const guest = -this.myColor, sameRevision = packet.revision === this.revision;
    if (packet.type === "MOVE") {
      const move = sameRevision && this.match.engine.turn === guest && !this.match.result && safeMove(packet)
        ? this.match.engine.resolve(packet, this.match.legal) : null;
      if (!move || this.match.project(move) !== packet.fen) this.sendState();
      else this.commitOnline(move);
    } else if (packet.type === "REQUEST" && sameRevision) {
      this.createOffer(packet.kind, guest);
    } else if (packet.type === "REPLY") {
      this.resolveOffer(packet.id, packet.accepted, guest);
    } else if (packet.type === "RESIGN" && this.match.resign(guest)) {
      this.afterFinish();
    } else if (packet.type === "CLAIM" && sameRevision && this.match.engine.turn === guest &&
        (packet.move === null || safeMove(packet.move)) && this.match.claim(packet.move)) {
      this.afterFinish();
    }
  }

  receiveAsGuest(packet) {
    if (packet.type === "STATE") { this.acceptState(packet); return; }
    if (packet.type === "MOVE") { this.acceptMove(packet); return; }
    if (packet.game !== this.gameId) return;
    if (packet.type === "CLOCK" && packet.revision === this.revision && this.match.running && validClocks(packet, this.match.minutes)) {
      this.match.readClocks(packet);
    } else if (packet.type === "OFFER" && packet.revision === this.revision) {
      const offer = this.validateOffer(packet.offer);
      if (!offer) return;
      this.setOffer(offer);
      if (offer.by === this.myColor) this.ui.toast("Đã gửi lời đề nghị.");
      this.ui.render();
    } else if (packet.type === "OFFER_END" && this.offer?.id === packet.id) {
      if (this.offer.by === this.myColor) this.ui.toast("Đối thủ đã từ chối.");
      this.setOffer(null);
      this.ui.render();
    }
  }
}

new ChessApp();
</script>
